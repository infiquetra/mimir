[package]
name = "mimir"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
oauth2 = "4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
directories = "5"
open = "5"
image = "0.25"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tempfile = "3"
# Test-only fixture signing (design J7): both already transitive via
# jsonwebtoken/rust_crypto; pinned to the same majors. Never in release.
rsa = "0.10"
p256 = { version = "0.14", features = ["ecdsa"] }
