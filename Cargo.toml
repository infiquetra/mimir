[package]
name = "mimir"
version = "0.1.0"
edition = "2021"

[dependencies]
# `wgpu_no_default_features` instead of `wgpu`: eframe's `wgpu` feature
# enables egui-wgpu/default -> wgpu/default -> `gles`, which pulls the
# `glow` OpenGL crate into the tree (card #651 forbids any glow).
# The direct `wgpu` dep below pins wgpu/default minus `gles`
# (Metal on macOS, Vulkan on Linux, DX12 on Windows).
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "accesskit", "clipboard", "default_fonts", "links", "persistence", "system_fonts", "wayland", "x11"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
oauth2 = "4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
directories = "5"
open = "5"
image = "0.25"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
notify = "8"
arboard = "3.7"
egui_tiles = "0.18"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
tempfile = "3"
# Test-only fixture signing (design J7): both already transitive via
# jsonwebtoken/rust_crypto; pinned to the same majors. Never in release.
rsa = "0.10"
p256 = { version = "0.14", features = ["ecdsa"] }
