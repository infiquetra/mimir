name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Job name must stay "Analyze": branch protection on main requires
    # the Analyze and Test status contexts by name.
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev pkg-config

      - name: Verify formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev pkg-config

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

  build-macos:
    # macOS is the primary desktop target; prove the crate (including the
    # keyring dependency) compiles and its tests pass there on every change.
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Test (macOS)
        run: cargo test

      - name: Build (macOS)
        run: cargo build

      - name: Package macOS .app bundle
        run: ./scripts/bundle-macos.sh --profile debug --skip-build --no-install --zip

      - name: Verify macOS .app bundle identity
        run: |
          test "$(plutil -extract CFBundleDisplayName raw target/debug/bundle/Alidade.app/Contents/Info.plist)" = "Alidade"
          codesign --verify --deep --strict target/debug/bundle/Alidade.app
